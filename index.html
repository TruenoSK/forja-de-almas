<style>
  :root { --oro:#d4af6a; }

  .marco {
    position: relative;
    border: 1px solid rgba(212,175,106,.45);
    background: linear-gradient(180deg, rgba(29,26,38,.92), rgba(20,18,27,.95));
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 30px rgba(212,175,106,.05), 0 10px 40px rgba(0,0,0,.5);
  }
  .marco::before, .marco::after {
    content:''; position:absolute; width:14px; height:14px;
    border-color: var(--oro); border-style: solid; pointer-events:none;
  }
  .marco::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .marco::after { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  .titulo-oro {
    background: linear-gradient(180deg, #f6e3b4 0%, #d4af6a 50%, #9c7a3c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .divisor { height:1px; background: linear-gradient(90deg, transparent, rgba(212,175,106,.7), transparent); }
  .opcion { transition: transform .12s ease, border-color .2s, background .2s; }
  .opcion:active { transform: scale(.97); }
  .opcion.sel { border-color:#f1d9a2; background: linear-gradient(180deg, rgba(122,31,43,.5), rgba(29,26,38,.95)); }
  .opcion.off { opacity:.35; }

  .campo {
    width:100%; background: rgba(11,10,15,.7); border:1px solid rgba(212,175,106,.4);
    border-radius: 14px; padding: 14px 16px; color:#f3eee8; outline:none;
    font-family: 'Cormorant Garamond', serif;
  }
  .campo:focus { border-color:#f1d9a2; box-shadow: 0 0 0 3px rgba(212,175,106,.15); }
  .campo::placeholder { color: rgba(168,161,184,.6); font-style: italic; }

  .btn-oro {
    background: linear-gradient(180deg, #f1d9a2, #d4af6a); color:#0b0a0f;
    box-shadow: 0 0 30px rgba(212,175,106,.3);
  }
  .btn-oro:disabled { opacity:.35; box-shadow:none; }

  .aparecer { animation: aparecer .35s ease both; }
  @keyframes aparecer { from { opacity:0; transform: translateY(12px);} to { opacity:1; transform:none;} }
  .chispa { animation: chispa 3s ease-in-out infinite; }
  @keyframes chispa { 0%,100%{ opacity:.6;} 50%{ opacity:1;} }

  pre.bloque {
    white-space: pre-wrap; word-break: break-word;
    font-family: 'Cormorant Garamond', serif; font-size: 17px; line-height: 1.45; color:#e9e4f0;

  .toast {
    position: fixed; left:50%; transform: translateX(-50%) translateY(20px);
    bottom: calc(env(safe-area-inset-bottom) + 24px);

  }

  ::-webkit-scrollbar { display:none; }

const state = { screen:"home", step:0, gender:"m", steps:[], answers:{}, result:null, writing:false };

/* =========================================================
   UTILIDADES
   ========================================================= */
const pick = a => Array.isArray(a) ? a[Math.floor(Math.random() * a.length)] : a;
const shuffle = a => { const b=[...a]; for (let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
function G(str) {
  if (!str) return str;
  let prev;
  do { prev = str; str = str.replace(/\[([^|\[\]]*)\|([^\[\]]*)\]/g, (_, m, f) => state.gender === "m" ? m : f); }
  while (str !== prev);
  return str;
}
function U(s) { const y = state.answers && state.answers.you; return String(s).replace(/\{\{user\}\}/g, y && y.name && y.name.trim() ? y.name.trim() : "quien tengas enfrente"); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }
function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; } }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1600);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
    document.execCommand("copy"); ta.remove();
  }
  toast("✦ Copiado al portapapeles");
}

/* =========================================================
   CONSTRUCCIÓN DEL TEST (las preguntas cambian en cada partida)
   ========================================================= */
function buildSteps() {
  const qs = shuffle(QUESTION_POOL).slice(0, 8).map(q => ({ type:"q", q, order: shuffle(q.opts.map((_, i) => i)) }));
  return [
    { type:"you", key:"you", title:"Enfrente", q:"¿Con quién vas a rolear?" },
    { type:"single", key:"court", title:"Corte", q:"¿A qué corte de Prythian pertenece?", data:COURTS },
    { type:"single", key:"race", title:"Linaje", q:"¿Qué sangre corre por tus venas?", data:RACES },
    { type:"single", key:"power", title:"Poder", q:"¿Qué poder despierta en [él|ella]?", data:POWERS },
    { type:"single", key:"rel", title:"Vínculo", q:"¿Qué le une a {{user}}?", data:RELATIONS },
    { type:"traits", key:"traits", title:"Personalidad", q:"¿Cómo es su alma?" },
    ...qs,
    { type:"look", key:"look", title:"Aspecto", q:"Los últimos detalles" }
  ];
}

/* =========================================================
   GENERADOR
   ========================================================= */
function generate() {
  const a = state.answers;
  const C = COURTS[a.court], R = RACES[a.race], P = POWERS[a.power], L = RELATIONS[a.rel];
  const T = (a.traits || []).map(k => TRAITS[k]);
  const look = a.look || {};
  const hair = look.hair != null ? HAIR[look.hair] : pick(HAIR);
  const eyes = look.eyes != null ? EYES[look.eyes] : pick(EYES);
  const skinO = look.skin != null ? SKIN_ALL[look.skin] : pick(SKIN_ALL);
  const buildO = look.build != null && BUILD_ALL[state.gender][look.build] ? BUILD_ALL[state.gender][look.build] : pick(BUILD_ALL[state.gender]);

  let first, name;
  if (look.name && look.name.trim()) { name = look.name.trim(); first = name.split(/\s+/)[0]; }
  else { first = pick(C.names[state.gender]); name = G(`${first} ${pick(C.houses)}`); }

  const you = a.you || {};
  const botName = (you.name || "").trim() || "{{char}}";
  const place = pick(C.places);
  // En las plantillas, {{char}} = el personaje que creas (tu persona) y {{user}} = el bot con el que roleas
  const fillKeep = s => G(s).replace(/\{\{char\}\}/g, first).replace(/\{\{user\}\}/g, botName).replace(/\{place\}/g, place).replace(/\{scent\}/g, SCENTS[a.court])
    .replace(/(\s)de el(\s)/g, "$1del$2").replace(/(\s)a el(\s)/g, "$1al$2").replace(/(\s)en en(\s)/g, "$1en$2");
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
  const low = s => s ? s[0].toLowerCase() + s.slice(1) : s;

  const extras = a.extras || {};
  const hidden = {}; for (const k in HIDDEN) hidden[k] = pick(HIDDEN[k]);
  const hiddenLines = Object.entries(hidden).map(([k, v]) => `[${k}: ${v}]`).join("\n");
  const extraLines = Object.values(extras).map(e => `[${e.field}: ${G(e.v)}]`).join("\n") + (Object.keys(extras).length ? "\n" : "") + hiddenLines;
  const imgOf = key => { const e = Object.values(extras).find(x => x.img === key); return e ? e.imgv : null; };
  const poolImg = id => pick(QUESTION_POOL.find(x => x.id === id).opts.filter(o => o.img)).img;

  const looksArr = shuffle(R.looks).slice(0, 2);
  const looks = looksArr.join("; ");
  const traitsText = T.map(t => t.t).join("; ") + (a.traitsFree && a.traitsFree.trim() ? `; ${a.traitsFree.trim()}` : "");
  const speech = T.map(t => t.sp).join(" ");
  const canWinnow = a.power !== "steel";
  const age = pick(R.age);
  const species = R.species(C);
  const powerTxt = `${P.text(C)}.${canWinnow ? " Puede tamizarse (winnowing): desaparecer y reaparecer en otro lugar." : ""} ${R.extra}`;
  const botLine = you.name && you.name.trim()
    ? `[Rolea con: ${you.name.trim()}${you.gender ? ` (${you.gender === "m" ? "hombre" : "mujer"})` : ""}${you.desc && you.desc.trim() ? `. ${cap(you.desc.trim())}` : ""}]\n` : "";

  /* 1 · PERSONA para Janitor (la descripción de tu personaje) */
  const definition = fillKeep(
`[Nombre: ${name}]
[Universo: Prythian (Una corte de rosas y espinas / ACOTAR)]
[Corte: ${C.label}]
[Especie: ${species}]
[Género: ${state.gender === "m" ? "masculino" : "femenino"}]
[Edad: ${age}]
[Apariencia: ${hair.es}, ${eyes.es}, ${skinO.es}, ${buildO.es}; ${looks}]
[Personalidad: ${traitsText}]
[Forma de hablar: ${speech}]
[Poder: ${powerTxt}]
[Debilidad: ${R.weak}]
${extraLines}
[Relación con {{user}}: ${L.rel}]
${botLine}[Secreto: ${L.secret}]`);

  /* 2 · Versión corta en prosa (por si el campo de persona se queda pequeño) */
  const shortV = fillKeep(
`${name} es ${low(species)}. ${cap(age)}. Tiene ${hair.es}, ${eyes.es}, ${skinO.es} y ${buildO.es}, con ${looksArr.join(" y ")}. Es ${traitsText.replace(/; /g, ", ")}. Poder: ${low(P.text(C))}. ${L.rel} Su secreto: ${low(L.secret)}`);

  /* 3 · Historia y contexto */
  const scenario = fillKeep(`${PRYTHIAN} ${C.lore} ${pick(L.scen)}`);

  /* 4 · Guía para rolear a tu personaje */
  const lines = shuffle([...T.flatMap(t => [...t.o, ...t.c])]).slice(0, 4);
  const exLines = T.slice(0, 2).map(t => { const [u, c] = pick(t.ex); return `Si te dicen «${u}» → ${c}`; });
  const guide = fillKeep(
`FORMA DE HABLAR
${speech}

GESTOS QUE PUEDES DESCRIBIR
• *${pick(R.action)}*
• ${cap(hidden["Manía"])}.

FRASES PARA TU PERSONAJE
${lines.map(l => `• "${l}"`).join("\n")}

CÓMO RESPONDERÍA
${exLines.map(l => `• ${l}`).join("\n")}

REGLAS DE PRYTHIAN QUE TU PERSONAJE RESPETA
• Como fae, no puede mentir abiertamente: domina las verdades a medias.
• Un trato mágico es vinculante y queda tatuado en la piel.
• El vínculo de pareja se acepta; nunca se impone.
• El fresno y el hierro le hieren; el faebane anula su magia.`);

  /* 5 · Primer mensaje para enviar tú al empezar el rol */
  const t1 = T[0], t2 = T[1] || T[0];
  const firstMsg = fillKeep(
`*${pick(L.open)}*

"${pick(t1.o)}"

*${pick(R.action)}*

"${pick(t2.c)}"`);

  const tags = ["ACOTAR","Prythian","Persona", ...C.tags, G(R.label), G(P.label), L.tag, ...T.map(t => G(t.label))];

  /* ---- Prompt de imagen: collage / moodboard cinematográfico ---- */
  const subject = state.gender === "m" ? "man" : "woman";
  const g = state.gender;
  const male = g === "m";
  const parts = {
    outfit: imgOf("outfit") ?? (a.race === "illyrian" ? "black Illyrian fighting leathers with bracers" : poolImg("ropa")),
    jewel:  imgOf("jewel") ?? poolImg("joya"),
    mark:   imgOf("mark") ?? (a.race === "illyrian" ? "Illyrian warrior tattoos on the shoulder" : poolImg("marca")),
    weapon: imgOf("weapon") ?? (a.race === "illyrian" ? "wielding a long Illyrian blade" : ""),
    sky:    imgOf("sky") ?? imgOf("season") ?? "blue hour twilight sky with dark clouds",
    place:  imgOf("place") ?? C.loc
  };
  const powerImg = { court:"", daemati:"faint violet glow in the eyes", shadow:"tendrils of living shadow curling around the body", seer:"faint silver light in the eyes", steel:"", cauldron:"an eerie dark aura" }[a.power];

  // Físico: depende de corte (piel), linaje (complexión), aspecto elegido (pelo/ojos) y rasgos (expresión)
  const tImg = (a.traits || []).map(k => TRAIT_IMG[k]).filter(Boolean);
  const mainT = tImg[0] || { face:"an intense gaze", pose:"standing tall" };
  const hairImg = `${HAIR_COLOR[hair.l] || "dark"} hair, ${pick(HAIR_STYLE[g])}`;
  const skin = skinO.img;
  const build = buildO.img;
  const face = pick(FACE[g]);
  const outfitImg = male ? `${parts.outfit}, worn open or shirtless to reveal a sculpted bare chest and defined abs` : parts.outfit;
  const character = [build, skin, face, R.img, hairImg, eyes.img, outfitImg, R.wings, parts.weapon, powerImg, imgOf("pet")].filter(Boolean).join(", ");

  // Paneles: núcleo fijo + paneles nacidos de las respuestas + relleno aleatorio
  const powerPanel = a.power === "court" ? POWER_PANEL.court[a.court] : POWER_PANEL[a.power];
  const answerPanels = [
    powerPanel,
    REL_PANEL[a.rel],
    `detail close-up of ${parts.jewel}`,
    `detail close-up of ${parts.mark}`,
    tImg[1] ? `${tImg[1].pose}, ${tImg[1].face}` : null,
    tImg[2] ? `close-up with ${tImg[2].face}` : null,
    imgOf("pet") ? `close-up of ${imgOf("pet").replace(/ (perched on the shoulder|at the side|on the arm)$/, "")}` : null
  ].filter(Boolean);
  const muscle = male ? [`bare muscular torso with ${build.includes("eight-pack") ? "a deeply defined eight-pack" : "sculpted defined abs"}, light sheen of sweat`, "muscular arm and veined forearm with an ornate leather bracer"] : [];
  const fillers = shuffle(EXTRA_PANELS[g]);
  const nPanels = pick([9, 10, 11, 12]);
  const core = [
    `close-up portrait with ${mainT.face}`,
    male ? "extreme macro close-up of one intense eye" : "extreme macro close-up of one eye with long lashes",
  ];
  const back = `back view${R.wings ? (male ? " of broad shoulders with the wings spread" : " showing the wings") : (male ? " of a broad muscular back" : "")} facing the landscape`;
  const center = `large full-body center panel of ${male ? "him" : "her"} ${mainT.pose}, on ${parts.place}, ${parts.sky}`;
  let middle = [...muscle, ...shuffle(answerPanels)];
  while (middle.length < nPanels - 4) middle.push(fillers.shift());
  middle = middle.slice(0, nPanels - 4);
  const panels = [...core, ...shuffle(middle), back, center].join("; ");

  const lens = pick(["shot on 85mm, shallow depth of field", "shot on 50mm film, soft focus edges", "cinematic anamorphic look", "medium format photography, crisp detail"]);
  const imgPrompt =
`character moodboard collage, grid of ${nPanels} cinematic photographic panels of the same ${subject}, A Court of Thorns and Roses inspired dark fantasy, High Fae with pointed ears, ${character}.
Panels: ${panels}.
Photorealistic, editorial dark fantasy photography, ${pick(LIGHTING[a.court])}, moody low-key lighting, deep shadows${male ? ", rim light sculpting the muscles" : ""}, dark palette of ${C.palette} with crimson undertones and subtle gold accents, desaturated tones, ${male ? "detailed skin texture" : "dewy skin texture"}, film grain, ${lens}, ultra detailed, 8k, thin dark borders between panels. Keep the same face and features in every panel.`;
  const negPrompt = "cartoon, anime, 3d render, bright colors, oversaturated, low quality, blurry, deformed hands, extra fingers, round human ears, text, watermark, logo, different faces"
    + (male ? ", feminine features, skinny, soft body, makeup, long eyelashes" : "");

  const tagline = `${C.label} · ${G(R.label)} · ${L.label}`;

  return { id: Date.now(), name, gender: state.gender, answers: JSON.parse(JSON.stringify(a)),
    tagline: G(tagline), definition, shortV, scenario, guide, firstMsg, tags, imgPrompt, negPrompt, world: C.label, icon: C.icon };
}

function fullText(r) {
  return `═══ ${r.name} ═══

▸ PERSONA (descripción para Janitor)
${r.definition}

▸ VERSIÓN CORTA
${r.shortV}

▸ HISTORIA Y CONTEXTO
${r.scenario}

▸ CÓMO ROLEARLE
${r.guide}

▸ PRIMER MENSAJE (para enviar tú)
${r.firstMsg}

▸ PROMPT DE IMAGEN (avatar)
${r.imgPrompt}

▸ PROMPT NEGATIVO
${r.negPrompt}`;
}

function optButton(attr, icon, label, sub, sel) {
  return `
    <button ${attr} class="opcion ${sel ? "sel" : ""} marco w-full rounded-2xl px-4 py-4 min-h-[72px] flex items-center gap-4 text-left">

function next() {
  state.writing = false;
  if (state.step < state.steps.length - 1) { state.step++; renderQuiz(); window.scrollTo({ top:0 }); }
  else forge();
}

function renderQuiz() {
  const s = state.steps[state.step];
  let body = "";

  if (s.type === "single") {
    const sel = state.answers[s.key];
    const court = COURTS[state.answers.court];
    body = `<div class="space-y-3 aparecer">${Object.entries(s.data).map(([k, o]) => {
      const sub = (s.key === "power" && k === "court" && court) ? court.gift : G(o.sub);
      return optButton(`data-opt="${k}"`, o.icon, G(o.label), sub, sel === k);
    }).join("")}</div>`;
  }

  if (s.type === "traits") {
    const sel = state.answers.traits || [];
    body = `
    <p class="text-center font-cormorant italic text-bruma text-lg -mt-3 mb-4">Elige hasta 3 rasgos y combínalos</p>
    <div class="grid grid-cols-2 gap-2.5 aparecer">
      ${Object.entries(TRAITS).map(([k, t]) => {
        const on = sel.includes(k), off = !on && sel.length >= 3;
        return `<button data-trait="${k}" class="opcion ${on ? "sel" : ""} ${off ? "off" : ""} marco rounded-xl px-3 py-3.5 min-h-[56px] flex items-center gap-2 text-left">
          <span class="text-xl">${t.icon}</span><span class="font-cinzel text-[13px] font-bold">${G(t.label)}</span></button>`;
      }).join("")}
    </div>
    <p class="font-cinzel text-[11px] tracking-[.2em] text-oro mt-5 mb-2">AÑADE ALGO CON TUS PALABRAS (OPCIONAL)</p>
    <textarea id="traitsFree" rows="2" class="campo" placeholder="Ej.: odia que le toquen las alas, le encantan las tormentas…">${esc(state.answers.traitsFree || "")}</textarea>
    <button id="cont" ${sel.length ? "" : "disabled"} class="btn-oro w-full mt-4 rounded-2xl py-4 font-cinzel font-bold tracking-widest">
      CONTINUAR · ${sel.length}/3
    </button>`;
  }

  if (s.type === "q") {
    const cur = state.answers.extras[s.q.id];
    body = `<div class="space-y-3 aparecer">
      ${s.order.map(i => { const o = s.q.opts[i];
        return optButton(`data-q="${i}"`, o.i, U(G(o.l)), "", cur && !cur.custom && cur.idx === i); }).join("")}
      ${state.writing ? `
        <div class="marco rounded-2xl p-4">
          <textarea id="customQ" rows="2" class="campo" placeholder="Escribe tu respuesta…">${esc(cur && cur.custom ? cur.v : "")}</textarea>
          <button id="customOk" class="btn-oro w-full mt-3 rounded-xl py-3.5 font-cinzel font-bold tracking-widest">CONFIRMAR</button>
        </div>` :
        optButton(`id="writeOwn"`, "✍️", "Escribir la mía", "Si ninguna encaja", cur && cur.custom)}
    </div>`;
  }

  if (s.type === "you") {
    const y = state.answers.you = state.answers.you || load("fda_you", { name:"", gender:null, desc:"" });
    body = `
    <div class="aparecer">
      <p class="text-center font-cormorant italic text-bruma text-lg -mt-3 mb-5">El bot de Janitor con el que vas a jugar. Si lo dejas vacío, se usará {{char}}</p>
      <p class="font-cinzel text-[11px] tracking-[.2em] text-oro mb-2">NOMBRE DEL BOT (OPCIONAL)</p>
      <input id="youName" class="campo" placeholder="Ej.: Rhysand, Kael…" value="${esc(y.name || "")}" autocomplete="off">
      <p class="font-cinzel text-[11px] tracking-[.2em] text-oro mt-5 mb-2">ES</p>
      <div class="grid grid-cols-2 gap-3">
        ${["m","f"].map(g => `<button data-yg="${g}" class="opcion ${y.gender === g ? "sel" : ""} marco rounded-xl py-3.5 font-cinzel">${g === "m" ? "♂ Hombre" : "♀ Mujer"}</button>`).join("")}
      </div>
      <p class="font-cinzel text-[11px] tracking-[.2em] text-oro mt-5 mb-2">QUIÉN ES (OPCIONAL)</p>
      <textarea id="youDesc" rows="2" class="campo" placeholder="Ej.: Alto Señor de la Corte Noche…">${esc(y.desc || "")}</textarea>
      <button id="youOk" class="btn-oro w-full mt-5 rounded-2xl py-4 font-cinzel font-bold tracking-widest">CONTINUAR</button>
    </div>`.replace(/\[([^|\[\]]*)\|([^\[\]]*)\]/g, (_, m, f) => state.gender === "m" ? m : f);
  }

  if (s.type === "look") {
    const lk = state.answers.look || {};
    const chips = (arr, key) => arr.map((o, i) => `
      <button data-look="${key}" data-i="${i}" class="opcion ${lk[key] === i ? "sel" : ""} marco rounded-xl px-3 py-3 font-cinzel text-[12px] font-bold">${G(o.l)}</button>`).join("");
    body = `
    <div class="aparecer">
      <p class="font-cinzel text-[11px] tracking-[.2em] text-oro mb-2">NOMBRE (OPCIONAL)</p>
      <input id="nameIn" class="campo" placeholder="Déjalo vacío y el Caldero elegirá" value="${esc(lk.name || "")}" autocomplete="off">
      <p class="font-cinzel text-[11px] tracking-[.2em] text-oro mt-5 mb-2">CABELLO</p>
      <div class="grid grid-cols-3 gap-2">${chips(HAIR, "hair")}</div>
      <p class="font-cinzel text-[11px] tracking-[.2em] text-oro mt-5 mb-2">OJOS</p>
      <div class="grid grid-cols-3 gap-2">${chips(EYES, "eyes")}</div>
      <p class="font-cinzel text-[11px] tracking-[.2em] text-oro mt-5 mb-2">TONO DE PIEL</p>
      <div class="grid grid-cols-3 gap-2">${chips(SKIN_ALL, "skin")}</div>
      <p class="font-cinzel text-[11px] tracking-[.2em] text-oro mt-5 mb-2">COMPLEXIÓN</p>
      <div class="grid grid-cols-3 gap-2">${chips(BUILD_ALL[state.gender], "build")}</div>
      <p class="text-center text-xs text-bruma/70 mt-3">Lo que no elijas se decidirá al azar</p>
      <button id="forgeBtn" class="btn-oro w-full mt-5 rounded-2xl py-5 font-cinzel font-bold text-lg tracking-widest">⚱️ FORJAR ALMA</button>
    </div>`;
  }

  app.innerHTML = quizShell(s, body);

  /* ---- eventos ---- */
  app.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
    state.answers[s.key] = b.dataset.opt; b.classList.add("sel"); setTimeout(next, 180);
  });

  app.querySelectorAll("[data-trait]").forEach(b => b.onclick = () => {
    state.answers.traitsFree = document.getElementById("traitsFree").value;
    const sel = state.answers.traits || []; const k = b.dataset.trait;
    if (sel.includes(k)) state.answers.traits = sel.filter(x => x !== k);
    else if (sel.length < 3) state.answers.traits = [...sel, k];
    const y = window.scrollY; renderQuiz(); window.scrollTo({ top:y });
  });
  const cont = document.getElementById("cont");
  if (cont) cont.onclick = () => { state.answers.traitsFree = document.getElementById("traitsFree").value; next(); };

  app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    const i = +b.dataset.q, o = s.q.opts[i];
    state.answers.extras[s.q.id] = { field:s.q.field, v:o.l, img:s.q.img || null, imgv:o.img || "", idx:i, custom:false };
    b.classList.add("sel"); setTimeout(next, 180);
  });
  const wo = document.getElementById("writeOwn");
  if (wo) wo.onclick = () => { state.writing = true; renderQuiz(); setTimeout(() => document.getElementById("customQ")?.focus(), 50); };
  const ok = document.getElementById("customOk");
  if (ok) ok.onclick = () => {
    const v = document.getElementById("customQ").value.trim();
    if (!v) { toast("Escribe algo primero"); return; }
    state.answers.extras[s.q.id] = { field:s.q.field, v, img:null, imgv:"", custom:true };
    next();
  };

  app.querySelectorAll("[data-look]").forEach(b => b.onclick = () => {
    const lk = state.answers.look = state.answers.look || {};
    lk.name = document.getElementById("nameIn").value;
    const k = b.dataset.look, i = +b.dataset.i;
    lk[k] = lk[k] === i ? null : i;
    const y = window.scrollY; renderQuiz(); window.scrollTo({ top:y });
  });
  const saveYou = () => { const y = state.answers.you; y.name = document.getElementById("youName").value; y.desc = document.getElementById("youDesc").value; };
  app.querySelectorAll("[data-yg]").forEach(b => b.onclick = () => { saveYou(); state.answers.you.gender = b.dataset.yg; renderQuiz(); });
  const yo = document.getElementById("youOk");
  if (yo) yo.onclick = () => {
    saveYou();
    store("fda_you", state.answers.you); next();
  };
  const fb = document.getElementById("forgeBtn");
  if (fb) fb.onclick = () => {
    const lk = state.answers.look = state.answers.look || {};
    lk.name = document.getElementById("nameIn").value; forge();
  };

  document.getElementById("back").onclick = () => {
    if (state.writing) { state.writing = false; renderQuiz(); return; }
    if (state.step === 0) { state.screen = "home"; render(); }
    else { state.step--; renderQuiz(); }
  };
}

function forge() {
  app.innerHTML = `
  <div class="flex-1 flex flex-col items-center justify-center text-center aparecer">
    <div class="text-6xl chispa">⚱️</div>
    <p class="font-cinzel titulo-oro text-2xl mt-6 tracking-widest">El Caldero hierve…</p>
    <p class="font-cormorant italic text-bruma text-lg mt-2">Un alma nueva despierta en Prythian</p>
  </div>`;
  setTimeout(() => {
    state.result = generate();
    const hist = load("fda_hist_persona", []); hist.unshift(state.result); store("fda_hist_persona", hist.slice(0, 10));
    state.screen = "result"; render();
  }, 1100);
}

function section(id, title, content, open, mono) {
  return `
  <details class="marco rounded-2xl overflow-hidden" ${open ? "open" : ""}>
    <summary class="list-none flex items-center justify-between px-4 py-4 cursor-pointer">
      <span class="font-cinzel font-bold text-sm tracking-widest text-oro">${title}</span>
      <span class="text-oro text-lg">✧</span>
    </summary>
    <div class="px-4 pb-4">
      <div class="divisor mb-3"></div>
      <pre class="bloque ${mono ? "mono" : ""}">${esc(content)}</pre>
      <button data-copy="${id}" class="mt-4 w-full rounded-xl py-3.5 font-cinzel text-xs tracking-widest border border-oro/50 text-oroclaro active:bg-oro/10">
        COPIAR ${title}
      </button>
    </div>
  </details>`;
}

function renderResult() {
  const r = state.result;
  const parts = { def:r.definition, short:r.shortV, scen:r.scenario, guide:r.guide, first:r.firstMsg,
    img:r.imgPrompt, neg:r.negPrompt, all:fullText(r) };
  app.innerHTML = `
  <div class="flex-1 flex flex-col aparecer">
    ${header(true)}
    <div class="marco rounded-2xl p-6 text-center mb-4">
      <div class="text-5xl">${r.icon}</div>
      <p class="font-cinzel text-[11px] tracking-[.3em] text-bruma mt-3">${esc(r.world.toUpperCase())}</p>
      <h2 class="font-cinzel font-black titulo-oro text-[26px] leading-tight mt-2">${esc(r.name)}</h2>
      <p class="font-cormorant italic text-bruma text-lg mt-2">${esc(r.tagline)}</p>
      <div class="flex flex-wrap justify-center gap-1.5 mt-4">
        ${r.tags.map(t => `<span class="text-[11px] px-2.5 py-1 rounded-full border border-oro/40 text-oroclaro/90">${esc(t)}</span>`).join("")}
      </div>
    </div>

    <button data-copy="all" class="btn-oro w-full rounded-2xl py-5 font-cinzel font-bold tracking-widest active:scale-[.98] transition mb-4">
      ✦ COPIAR TODO
    </button>

    <div class="space-y-3">
      <p class="text-center font-cormorant italic text-bruma text-[15px] -mt-1 mb-1">Pega la persona en Janitor → Perfil → Personas</p>
      ${section("def", "PERSONA", r.definition, true)}
      ${section("short", "VERSIÓN CORTA", r.shortV)}
      ${section("guide", "CÓMO ROLEARLE", r.guide)}
      ${section("first", "PRIMER MENSAJE", r.firstMsg)}
      ${section("scen", "HISTORIA", r.scenario)}
      ${section("img", "PROMPT DE IMAGEN", r.imgPrompt, false, true)}
      ${section("neg", "PROMPT NEGATIVO", r.negPrompt, false, true)}
    </div>

    <div class="grid grid-cols-2 gap-3 mt-5">
      <button id="reroll" class="opcion marco rounded-2xl py-4 font-cinzel text-xs tracking-widest text-oroclaro">🎲 OTRA VERSIÓN</button>
      <button id="share" class="opcion marco rounded-2xl py-4 font-cinzel text-xs tracking-widest text-oroclaro">📤 COMPARTIR</button>
    </div>
    <button id="restart" class="w-full mt-3 py-4 font-cinzel text-sm tracking-widest text-bruma active:text-oro">↺ NUEVO PERSONAJE</button>
  </div>`;

  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(parts[b.dataset.copy]));
  document.getElementById("reroll").onclick = () => forge();
  document.getElementById("restart").onclick = () => { state.screen = "home"; render(); };
  document.getElementById("share").onclick = async () => {
    if (navigator.share) { try { await navigator.share({ title:r.name, text:fullText(r) }); } catch (e) {} }
    else copy(fullText(r));
  };
}

function render() {
  window.scrollTo({ top:0 });
  if (state.screen === "home") renderHome();
  else if (state.screen === "quiz") renderQuiz();
  else renderResult();
}

/* =========================================================
   ICONO + MANIFEST (generados al vuelo)
   ========================================================= */
(function pwaAssets() {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 180;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(90, 60, 10, 90, 90, 120);
    g.addColorStop(0, "#3a1219"); g.addColorStop(1, "#0b0a0f");
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.strokeStyle = "#d4af6a"; x.lineWidth = 4; x.strokeRect(14, 14, 152, 152);
    x.lineWidth = 1.5; x.strokeRect(22, 22, 136, 136);
    x.fillStyle = "#e9c987"; x.font = "bold 92px Georgia, serif";
    x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("F", 90, 96);
    x.font = "20px Georgia, serif"; x.fillText("✦", 90, 38); x.fillText("✦", 90, 148);
    const png = c.toDataURL("image/png");
    document.getElementById("appleIcon").href = png;
    const manifest = { name:"Forja de Almas", short_name:"Forja", display:"standalone", start_url:location.href,
      background_color:"#0b0a0f", theme_color:"#0b0a0f", icons:[{ src:png, sizes:"180x180", type:"image/png" }] };
    document.getElementById("manifestLink").href =
      URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:"application/manifest+json" }));
  } catch (e) {}
})();

render();
</script>
</body>
